image:
  repository: ghcr.io/mjudeikis/baltic-osint-hub
  tag: latest
  pullPolicy: Always

server:
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

collector:
  # Every 30 minutes; per-source intervals are enforced internally.
  schedule: "*/30 * * * *"
  enrichModel: gpt-5-mini
  maxEnrichPerRun: "300"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Secret injected wholesale into both workloads via envFrom. Create it from
# your local .env:
#   kubectl -n osint create secret generic baltic-osint-hub --from-env-file=.env
# Keys: OPENAI_API_KEY (required for classification); optional: FIRMS_MAP_KEY,
# OPENSKY_CLIENT_ID/OPENSKY_CLIENT_SECRET, AISSTREAM_API_KEY,
# ACLED_EMAIL/ACLED_PASSWORD, and DATABASE_URL when postgres.enabled=false.
# A local-dev DATABASE_URL/STATIC_DIR in the secret is harmless — the chart
# overrides both (unless postgres.enabled=false, where the secret's
# DATABASE_URL is authoritative).
existingSecret: baltic-osint-hub

# Self-contained Postgres. Disable and set DATABASE_URL in the secret to use
# an external database instead.
postgres:
  enabled: true
  image: postgres:17-alpine
  storage: 5Gi
  storageClassName: ""
  user: osint
  password: osint # local cluster default; override for anything shared
  database: osint

service:
  # ClusterIP; point the Cloudflare tunnel at
  # http://<release>-baltic-osint-hub.<namespace>.svc:8080
  port: 8080
