image:
  repository: ghcr.io/mjudeikis/baltic-osint-hub
  # `latest` works out of the box. For anything you care about pin a build:
  # CI tags every push to main as `:<full sha>` and `:sha-<short sha>`, so
  #   --set image.tag=$(git rev-parse HEAD)
  # makes the running version visible and rollback a one-liner. See
  # docs/self-hosting.md.
  tag: latest
  # Optional immutable reference; when set it wins over `tag`.
  # digest: sha256:...
  # Empty = automatic: Always for `latest`, IfNotPresent for anything else.
  pullPolicy: ""

server:
  # Must stay 1. The server hosts two in-process background loops (the
  # aisstream.io live AIS watch and the Digitraffic AIS archive poller); a
  # second replica would open a second stream and double-write every
  # detection. Horizontal scaling is unsupported until those move out of the
  # server process.
  replicas: 1
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

collector:
  # Hourly. Per-source and per-layer minimum intervals are enforced inside the
  # collector, so changing this only shifts worst-case staleness — it does not
  # multiply calls to rate-limited upstreams.
  schedule: "0 * * * *"
  enrichModel: gpt-5-mini
  maxEnrichPerRun: "300"
  # Event clustering. Embeddings are cheap next to classification, so this is
  # set high enough to clear the historical backlog over a few runs.
  maxClusterPerRun: "1000"
  # Cosine similarity at which two reports are treated as the same event.
  # Raising it merges less. Measured, not guessed — see the calibration test in
  # internal/cluster: real duplicates score 0.73-0.86 and distinct events that
  # clear the category and country guards top out at 0.64.
  clusterThreshold: "0.70"
  # Cap on one collector run (RUN_TIMEOUT_MINUTES). The Job's
  # activeDeadlineSeconds (3900) must stay above this.
  runTimeoutMinutes: "50"
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi

# Secret injected wholesale into both workloads via envFrom. It MUST exist
# before `helm install` — pods will not start without it. Create it from your
# local .env:
#   kubectl -n osint create secret generic baltic-osint-hub --from-env-file=.env
# Keys: OPENAI_API_KEY (required for classification); optional: FIRMS_MAP_KEY,
# OPENSKY_CLIENT_ID/OPENSKY_CLIENT_SECRET, AISSTREAM_API_KEY,
# COPERNICUS_CLIENT_ID/COPERNICUS_CLIENT_SECRET,
# and DATABASE_URL when postgres.enabled=false.
# A local-dev DATABASE_URL/STATIC_DIR in the secret is harmless — the chart
# overrides both (unless postgres.enabled=false, where the secret's
# DATABASE_URL is authoritative).
existingSecret: baltic-osint-hub

# Self-contained Postgres. Disable and set DATABASE_URL in the secret to use
# an external database instead.
postgres:
  enabled: true
  # Pin this for anything you care about — either an exact patch
  # (postgres:17.6-alpine) or, better, a digest (postgres:17-alpine@sha256:...),
  # so a node re-pull cannot silently move you across a minor release. Major
  # upgrades need pg_upgrade or dump/restore; the chart does not do them.
  image: postgres:17-alpine
  storage: 5Gi
  storageClassName: ""
  user: osint
  # Leave empty to have the chart generate a random password on first install
  # and keep it across upgrades (the Secret carries helm.sh/resource-policy:
  # keep and is re-read on upgrade). Set it only if you need a known value.
  password: ""
  database: osint
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi
  # Daily pg_dump -Fc to a dedicated PVC, keeping the newest `keep` files.
  # Restore instructions: docs/self-hosting.md#backups.
  backup:
    enabled: false
    schedule: "30 3 * * *"
    keep: 14
    storage: 5Gi
    storageClassName: ""

service:
  # ClusterIP; the Gateway API route below (or your own tunnel config) points at
  # http://<release>-baltic-osint-hub.<namespace>.svc:8080
  port: 8080

# Public exposure via a Gateway API HTTPRoute. On the home cluster this attaches
# to the cfgate Cloudflare Tunnel gateway, which creates the proxied CNAME to
# <tunnel-id>.cfargotunnel.com automatically — the hostname's zone must be
# listed in the cfgate CloudflareDNS resource.
# osintbaltic.com is the project's public domain; override hostnames when
# deploying your own instance.
route:
  enabled: false
  hostnames:
    - osintbaltic.com
  gateway:
    name: cloudflare-tunnel
    namespace: cfgate-system
