apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "osint.name" . }}
  labels:
    {{- include "osint.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.server.replicas }}
  selector:
    matchLabels:
      {{- include "osint.labels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "osint.labels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - containerPort: 8080
          # The whole secret is injected via envFrom (create it with
          # --from-env-file=.env). Explicit env entries below take precedence,
          # deliberately overriding the local-dev DATABASE_URL/STATIC_DIR a
          # copied .env may carry.
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
                optional: true
          env:
            {{- include "osint.dbEnv" . | nindent 12 }}
            - name: STATIC_DIR
              value: /srv/web
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "osint.name" . }}
  labels:
    {{- include "osint.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "osint.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - port: {{ .Values.service.port }}
      targetPort: 8080
