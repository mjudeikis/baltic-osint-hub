apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "osint.name" . }}-collector
  labels:
    {{- include "osint.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.collector.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      # Must exceed RUN_TIMEOUT_MINUTES: one run walks the whole SAR watchlist,
      # which is a separate Copernicus round-trip per site.
      activeDeadlineSeconds: 3900
      template:
        metadata:
          labels:
            {{- include "osint.labels" . | nindent 12 }}
            app.kubernetes.io/component: collector
        spec:
          restartPolicy: Never
          containers:
            - name: collector
              image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command: ["/usr/local/bin/collector"]
              # All keys come from the secret via envFrom (create it with
              # --from-env-file=.env). Explicit env entries take precedence,
              # deliberately overriding the local-dev DATABASE_URL a copied
              # .env may carry, and pinning model/cost settings to values.
              envFrom:
                - secretRef:
                    name: {{ .Values.existingSecret }}
                    optional: true
              env:
                {{- include "osint.dbEnv" . | nindent 16 }}
                - name: ENRICH_MODEL
                  value: {{ .Values.collector.enrichModel | quote }}
                - name: MAX_ENRICH_PER_RUN
                  value: {{ .Values.collector.maxEnrichPerRun | quote }}
              resources:
                {{- toYaml .Values.collector.resources | nindent 16 }}
