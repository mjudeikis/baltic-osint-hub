{{- if .Values.postgres.enabled }}
{{- $password := include "osint.postgresPassword" . }}
# Chart-managed Postgres credentials. Kept on uninstall so a re-install finds
# the password the PVC's data directory was initialised with; delete it by
# hand together with the PVC if you really mean to start over.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "osint.postgresSecret" . }}
  labels:
    {{- include "osint.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgres://%s:%s@%s-postgres:5432/%s" .Values.postgres.user ($password | urlquery) (include "osint.name" .) .Values.postgres.database | quote }}
{{- end }}
